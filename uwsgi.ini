# sudo ln -s /var/www/backgammon/uwsgi.ini /etc/uwsgi/apps-enabled/backgammon.ini
[uwsgi]
plugins = python3
chdir = /var/www/backgammon
module = server:app
virtualenv = /var/www/backgammon/venv
# runs as andrew: the app writes build artefacts into built/ alongside the source
uid = andrew
gid = andrew
socket = /tmp/backgammon.sock
chmod-socket = 660
vacuum = true
touch-reload = /tmp/backgammon.touchme
