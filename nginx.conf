# sudo ln -s /var/www/backgammon/nginx.conf /etc/nginx/sites-enabled/backgammon.conf
server {
  server_name b.pullrope.net;

  location /static/ {
    alias /var/www/backgammon/static/;
    expires 1y;
    add_header Cache-Control "public, immutable";

    # Debian's mime.types has no .mjs, and a module script served as
    # application/octet-stream is refused outright by the browser.
    types { application/javascript js mjs; text/css css; image/svg+xml svg; }
    default_type application/octet-stream;
  }

  location / {
    include uwsgi_params;
    uwsgi_pass unix:/tmp/backgammon.sock;
  }

    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/b.pullrope.net/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/b.pullrope.net/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot
}

server {
    if ($host = b.pullrope.net) {
        return 301 https://$host$request_uri;
    } # managed by Certbot

  listen 80;
  server_name b.pullrope.net;
    return 404; # managed by Certbot
}
